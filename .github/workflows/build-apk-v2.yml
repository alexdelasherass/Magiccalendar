name: Construir APK Alex Magia v2

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Extraer proyecto
        run: |
          rm -rf proyecto
          mkdir proyecto
          unzip -q Alex_Magia_App_con_compilacion.zip -d proyecto

      - name: Configurar AndroidX y Java 17
        run: |
          cat > proyecto/gradle.properties <<'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          kotlin.jvm.target.validation.mode=warning
          EOF

          python3 - <<'PY'
          from pathlib import Path

          p = Path("proyecto/app/build.gradle.kts")
          text = p.read_text()

          text = text.replace(
              'android { namespace = "com.alexdelasheras.magia"; compileSdk = 35',
              '''android {
              namespace = "com.alexdelasheras.magia"
              compileSdk = 35

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }'''
          )

          text += '''

          kotlin {
              jvmToolchain(17)
          }
          '''

          p.write_text(text)
          PY

      - name: Compilar APK
        working-directory: proyecto
        run: gradle assembleDebug --no-daemon

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: AlexMagia-APK
          path: proyecto/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
