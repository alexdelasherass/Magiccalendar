name: Construir APK Alex Magia

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Descomprimir proyecto
        run: |
          mkdir proyecto
          unzip -q Alex_Magia_App_con_compilacion.zip -d proyecto

      - name: Configurar AndroidX
        run: |
          touch proyecto/gradle.properties
          if grep -q '^android.useAndroidX=' proyecto/gradle.properties; then
            sed -i 's/^android.useAndroidX=.*/android.useAndroidX=true/' proyecto/gradle.properties
          else
            echo 'android.useAndroidX=true' >> proyecto/gradle.properties
          fi
          if grep -q '^android.enableJetifier=' proyecto/gradle.properties; then
            sed -i 's/^android.enableJetifier=.*/android.enableJetifier=true/' proyecto/gradle.properties
          else
            echo 'android.enableJetifier=true' >> proyecto/gradle.properties
          fi

      - name: Configurar JVM 17
        run: |
          cat > proyecto/jvm17.init.gradle <<'EOF'
          allprojects {
              tasks.withType(JavaCompile).configureEach {
                  sourceCompatibility = '17'
                  targetCompatibility = '17'
              }
          }
          EOF

      - name: Compilar APK
        working-directory: proyecto
        run: |
          gradle -I jvm17.init.gradle assembleDebug --no-daemon

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: AlexMagia-APK
          path: proyecto/app/build/outputs/apk/debug/app-debug.apk
