name: Construir APK Alex Magia

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Descomprimir proyecto
        run: |
          mkdir proyecto
          unzip -q Alex_Magia_App_con_compilacion.zip -d proyecto

      - name: Configurar AndroidX
        run: |
          touch proyecto/gradle.properties
          echo "android.useAndroidX=true" >> proyecto/gradle.properties
          echo "android.enableJetifier=true" >> proyecto/gradle.properties

      - 

      - name: Compilar APK
        working-directory: p      - name: Configurar Java y Kotlin a JVM 17
        run: |
          gradle.allprojects {
              tasks.withType(org.gradle.api.tasks.compile.JavaCompile).configureEach {
                  sourceCompatibility = '17'
                  targetCompatibility = '17'
              }

              tasks.configureEach { task ->
                  if (task.name.contains('Kotlin')) {
                      task.kotlinOptions.jvmTarget = '17'
                  }
              }
          }royecto
        run: |
          gradle -I jvm17.init.gradle assembleDebug --no-daemon

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: AlexMagia-APK
          path: proyecto/app/build/outputs/apk/debug/app-debug.apk
